name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  line-endings:
    name: Line endings (LF only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # .gitattributes pins the repo to LF. A CRLF shebang in a script that gets
      # COPY'd into a Linux image (infra/backup/backup.sh) dies with "bad
      # interpreter", so catch it at the blob rather than at deploy.
      - name: Fail on CRLF in any tracked blob
        run: |
          offenders=$(git ls-files --eol | grep -E '^i/(crlf|mixed)' || true)
          if [ -n "$offenders" ]; then
            echo "These tracked files are stored with CRLF:"
            echo "$offenders"
            echo
            echo "Fix with: git add --renormalize . && git commit"
            exit 1
          fi

  api:
    name: API (lint, types, isolation suite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops
          POSTGRES_DB: ops_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      # Includes the CI-blocking cross-tenant isolation suite (spec §9.1).
      - run: uv run pytest -q
      # Fails on any known vulnerability (pip-audit has no severity filter).
      - run: uv run pip-audit --progress-spinner off

  worker:
    name: Worker (lint, chunker tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # Base deps only — the docling `parse` extra stays out of CI; the
      # chunker/parser-fallback tests are dependency-free by design.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # Fails on any known vulnerability (pip-audit has no severity filter).
      - run: uv run pip-audit --progress-spinner off

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      # Fails on high/critical advisories, including transitive deps.
      - run: pnpm audit --audit-level high

  web-e2e:
    name: Web (Playwright e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Mocked backend — the specs intercept every API and auth request, so
      # no database or API process is needed (env comes from playwright.config).
      - run: pnpm test:e2e
