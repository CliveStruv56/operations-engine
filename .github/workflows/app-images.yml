# API image → GHCR (staging pulls it; same rationale as worker-image.yml —
# no local builds on the fragile dev Docker VM). The web image is only
# build-validated here: NEXT_PUBLIC_* bake in at build, so the real web image
# is built at deploy (Coolify) with per-environment args.
name: App images

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/app-images.yml"
  workflow_dispatch:

env:
  # GHCR image names must be lowercase; github.repository is mixed-case.
  API_IMAGE: ghcr.io/clivestruv56/operations-engine-api

jobs:
  api-build-push:
    name: API image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # arm64 via QEMU: dev machines are Apple Silicon; staging is amd64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-build-check:
    name: Web Dockerfile builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://dummy.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-anon-key
            NEXT_PUBLIC_API_URL=https://dummy-api.example.com
            NEXT_PUBLIC_STORAGE_ORIGIN=https://dummy.r2.cloudflarestorage.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
