# Builds the worker image on GitHub runners and pushes it to GHCR — local
# machines pull instead of building (Docker Desktop 4.83's VM crashes on
# this build; see docs/staging-deploy-checklist.md §4). Staging pulls the
# same image.
name: Worker image

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch:

env:
  # GHCR image names must be lowercase; github.repository is mixed-case.
  IMAGE: ghcr.io/clivestruv56/operations-engine-worker

jobs:
  build-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # arm64 via QEMU: dev machines are Apple Silicon; staging is amd64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
