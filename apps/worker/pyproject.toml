[project]
name = "ops-engine-worker"
version = "0.1.0"
description = "Operations Engine ingestion worker: Docling parse, chunk, embed"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.26",
    "asyncpg>=0.29",
    "boto3>=1.34",
    "cryptography>=42",
    "httpx>=0.27",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.4",
    "python-docx>=1.2.0",
    "sentry-sdk>=2.0",
    "weasyprint>=69.0",
]

[project.optional-dependencies]
# Docling (torch etc.) only installs in the worker image — CI runs the pure
# chunker tests against the base dependencies.
parse = ["docling>=2.15"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
