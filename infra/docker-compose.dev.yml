name: ops-engine-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops_engine"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # LiteLLM gets its own small Postgres for virtual keys + spend (spec §4).
  # In prod both run on an internal network only; in dev the proxy binds to
  # localhost so the API (running on the host) can reach it.
  litellm-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 2s
      timeout: 2s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    depends_on:
      litellm-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-master-key}
      LITELLM_DATABASE_URL: postgresql://litellm:litellm@litellm-postgres:5432/litellm
      DATABASE_URL: postgresql://litellm:litellm@litellm-postgres:5432/litellm
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  # S3-compatible storage for local dev; prod uses Cloudflare R2 with the
  # same client config (endpoint + keys swap via env).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minio-dev}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minio-dev-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-minio-dev} ${STORAGE_SECRET_KEY:-minio-dev-secret} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-vault}
      "

  worker:
    # CI builds this image (.github/workflows/worker-image.yml) — refresh with
    # `docker compose pull worker`, do NOT build locally: the heavy build
    # crashes Docker Desktop 4.83's VM. `build:` stays as a fallback only
    # (compose builds when the image is absent locally). GHCR is private:
    # `gh auth token | docker login ghcr.io -u <user> --password-stdin` first.
    image: ghcr.io/clivestruv56/operations-engine-worker:latest
    build: ../apps/worker
    # First boot on a fresh volume races Alembic (the ops_app role doesn't
    # exist until migration 0001 runs) — restart until migrations land.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
      litellm:
        condition: service_started
    environment:
      APP_DATABASE_URL: postgresql://ops_app:ops_app@postgres:5432/ops_engine
      REDIS_URL: redis://redis:6379/0
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_KEY_ENCRYPTION_KEY: ${LITELLM_KEY_ENCRYPTION_KEY:-}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-vault}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minio-dev}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minio-dev-secret}
    volumes:
      # Docling layout/table models download once, persist across recreates.
      - worker_model_cache:/home/worker/.cache

volumes:
  pgdata:
  litellm_pgdata:
  minio_data:
  worker_model_cache:
