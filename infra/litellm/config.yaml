# LiteLLM proxy config — spec §4. App code references aliases only.
# Slugs verified against live catalogues 27 Jul 2026, drafter re-verified
# against the OpenRouter endpoints API 4 Aug 2026:
#   deepinfra: zai-org/GLM-4.7-Flash, zai-org/GLM-5.2, Qwen/Qwen3-Embedding-4B
#   openrouter: openai/gpt-oss-120b, deepseek/deepseek-v4-flash
# Deviation from spec draft: longdoc provider order was ["Together","DeepInfra"],
# but Together no longer hosts deepseek-v4-flash on OpenRouter — pinned to
# DeepInfra + Fireworks (both US) instead.
model_list:
  - model_name: workhorse
    litellm_params:
      model: deepinfra/zai-org/GLM-4.7-Flash
      api_key: os.environ/DEEPINFRA_API_KEY

  # Through OpenRouter rather than Groq directly (4 Aug 2026). Groq's own free
  # tier is 200k tokens/day against ~51k per draft — the daily cliff behind the
  # measured ~3 min/call, which is backoff, not generation — and paid upgrades
  # were closed to new accounts. OpenRouter resells the same Groq capacity at
  # $0.15/$0.60, which is *exactly* what ALIAS_PRICES_PER_MTOK already claims
  # `drafter` costs in both app/litellm.py and worker/drafting/llm.py, so cost
  # telemetry and the spec §11 reconciliation stay correct with no other edit.
  #
  # Nebius and Together bill identically to Groq and stand in when it is
  # saturated, which happens often enough to dominate a draft's wall clock:
  # Groq serves at 337–403 tok/s, the stand-ins at 76–152, so an unlucky run
  # takes twice as long as a lucky one (§6j). **Nebius before Together** on
  # measurement — 113–152 vs 76–116 tok/s, 5 Aug 2026.
  #
  # allow_fallbacks stays false so a request can only ever land on one of these
  # three vetted Western hosts — the same discipline as `longdoc` below. Adding
  # a provider here without checking its rate silently breaks the §11 5% rule;
  # Cerebras is faster still but bills $0.35/$0.75 and would need the price
  # tables in both files updated first.
  - model_name: drafter
    litellm_params:
      model: openrouter/openai/gpt-oss-120b
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          order: ["Groq", "Nebius", "Together"]
          allow_fallbacks: false
          data_collection: deny

  # Same model as before, faster host (5 Aug 2026). GLM-5.2 on DeepInfra ran
  # 30–74 tok/s and wildly inconsistent — measured 15.2/30.4/34.8/42.5s on four
  # identical section-shaped calls. CoreWeave serves the same weights at
  # 159–196 tok/s and 6.2–8.3s, with equal or more prose. One `reasoner`
  # section was 17.5s of a 35.1s draft; this is that half.
  #
  # The order is a correctness ranking as much as a speed one. **DigitalOcean
  # and Novita must never be added**: both ignore `reasoning_effort` and
  # returned `finish=length` with *zero* prose, spending the whole 4096-token
  # budget thinking — precisely the 3 Aug failure that filed documents with
  # missing sections (§6h). DeepInfra stays as the fallback because it is slow
  # but proven correct, and both bill within 1% of each other so the price
  # table below holds whichever serves.
  - model_name: reasoner
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY
      # REQUIRED, and its absence fails silently. LiteLLM's own param
      # validation rejects `reasoning_effort` for openrouter/z-ai/* before the
      # request leaves the proxy — OpenRouter itself accepts it fine — and the
      # resulting 400 was swallowed by the `reasoner: [longdoc]` fallback, so
      # every financial section was quietly written by deepseek-v4-flash and
      # metered at reasoner rates. Never "fix" this with `drop_params: true`:
      # that drops the effort bound instead, and an unbounded GLM-5.2 spends
      # its whole budget thinking and returns an empty section (§6h).
      allowed_openai_params: ["reasoning_effort"]
      extra_body:
        provider:
          order: ["CoreWeave", "DeepInfra"]
          allow_fallbacks: false
          data_collection: deny

  - model_name: longdoc
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          order: ["DeepInfra", "Fireworks"]
          allow_fallbacks: false
          data_collection: deny

  # openai/ prefix + api_base: LiteLLM's deepinfra provider has no /embeddings
  # mapping, but DeepInfra's OpenAI-compatible endpoint works for it.
  - model_name: embedder
    litellm_params:
      model: openai/Qwen/Qwen3-Embedding-4B
      api_base: https://api.deepinfra.com/v1/openai
      api_key: os.environ/DEEPINFRA_API_KEY
      # Qwen3 is MRL-trained; 2048 matches doc_chunks vector(2048). Sent via
      # extra_body because LiteLLM's own `dimensions` validation only allows
      # OpenAI text-embedding-3 models; DeepInfra honours the raw param.
      extra_body:
        dimensions: 2048

router_settings:
  fallbacks:
    - workhorse: [drafter]
    - drafter: [workhorse]
    - reasoner: [longdoc]
    - longdoc: [reasoner]
  # Suits the worker, where a draft is already minutes long and a retry is
  # cheap insurance. It is the wrong default for chat, where each retry can
  # add two minutes in front of someone watching a spinner — so the API
  # overrides it per request with `x-litellm-num-retries` (app/litellm.py).
  num_retries: 2
  timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
