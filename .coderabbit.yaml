# CodeRabbit review settings for Flowgrid OS.
#
# CodeRabbit already reads CLAUDE.md (and other agent guideline files) as
# review criteria. This file adds what that cannot: where each rule bites
# (path_instructions), stacked PRs reviewed before they retarget to main, and
# less noise in the walkthrough. Reference:
# https://docs.coderabbit.ai/reference/configuration
language: en-GB

reviews:
  profile: chill
  in_progress_fortune: false
  poem: false
  auto_review:
    enabled: true
    # Stacked PRs target another PR's branch, not main. Review them as they
    # arrive instead of waiting for the retarget after the base merges.
    base_branches:
      - ".*"
  path_filters:
    # Regenerated by tooling, never edited by hand.
    - "!apps/web/pnpm-lock.yaml"
    - "!apps/api/uv.lock"
    - "!apps/worker/uv.lock"
  path_instructions:
    - path: "apps/api/migrations/versions/**"
      instructions: |
        Tenant isolation is enforced by Postgres row-level security (CLAUDE.md
        hard constraint 2). For any new tenant-scoped table, check that:
        - it gets the `tenant_isolation` policy (helper in `migrations/rls.py`);
        - it is listed in `app/modules.py`, either under its module's `tables`
          or in `CORE_TENANT_TABLES`, so the RLS coverage test sees it;
        - the PR adds an isolation test in `apps/api/tests/test_isolation.py`.
        A new project kind needs both a registry entry in
        `app/projects/kinds.py` and a widened `projects_kind_check` constraint.
        Flag a `downgrade()` that does not undo its `upgrade()`.
    - path: "apps/api/app/**"
      instructions: |
        - Every tenant-facing route runs inside the tenant RLS context
          (`require_role` or a `make_feature_gate` gate, plus `get_conn`).
          `db.platform_tx()` is allowed only in `app/routers/admin.py`.
        - Module routes must 404, not 403, when the workspace's feature flag
          is off (`make_feature_gate`).
        - No model-provider SDKs (openai, anthropic and the like): all model
          access goes through the LiteLLM gateway in `app/litellm.py`, and
          every LLM call records cost telemetry.
        - SQL is raw asyncpg with `$n` parameters. f-strings may assemble
          clauses and placeholders but must never interpolate values.
        - Pydantic models belong in `app/schemas.py`,
          `app/groundwork/schemas.py`, `app/crm/schemas.py` or
          `app/grants/schemas.py`, not inline in routers.
        - Where code knowingly departs from `docs/phase-1-build-spec.md` or
          `docs/groundwork-module-prd.md`, the divergence must be recorded in
          `docs/groundwork/ASSUMPTIONS.md`.
    - path: "apps/api/tests/**"
      instructions: |
        `seed_tenant` in `tests/conftest.py` already writes a row to every
        tenant-scoped table, including a grant application and a contact
        linked to the tenant's project. A test that expects an exact list from
        a fresh tenant may therefore be wrong; prefer asserting membership.
    - path: "apps/web/**/*.tsx"
      instructions: |
        Design system (CLAUDE.md, "Working conventions"):
        - No meaningful text below 12px (`text-xs`). Muted text uses `--faint`.
          Bordered non-field controls use `--edge-ui`, not the bone hairline.
        - Two accents only: Burnt Amber fills primary actions; Deep Violet owns
          links, focus and selection. No saturated colour.
        - The pastel Stamp tones are a fixed status taxonomy (sage = upcoming,
          lavender = in progress, rose = complete). Flag decorative use.
        - Tenant `brand.accent` colours are for exports only, never app chrome.
        - API calls go through `lib/api.ts` (or the module helpers built on
          it). Keep shared response types in `lib/*.ts`.
        - Plain names in the UI ("Development projects", "Grant funding"), not
          brand names. Check accessible names on icon-only controls.
        - Keep files under about 400 lines.
    - path: "apps/web/**/*.test.{ts,tsx}"
      instructions: |
        - In Vitest, a `beforeEach`/`afterEach` arrow that returns a value
          (`() => mock.mockReset()`) hands Vitest a teardown function. Prefer a
          block body.
        - Pages that read route params with React's `use(params)` suspend.
          Test the inner component that takes the id, not the route file.
        - Next.js navigation is mocked globally in `vitest.setup.ts`.
    - path: "docs/**"
      instructions: |
        Check that docs stay consistent with the code changed in the same PR,
        and that statuses ("built", "phase N") match what the PR delivers.

knowledge_base:
  code_guidelines:
    enabled: true
